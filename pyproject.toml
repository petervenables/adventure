[project]
name = "adventure"
version = "0.1.0"
description = "A text-based adventure game."
authors = [
    { name="Peter Venables", email="pvenables@gmail.com" }
]
readme = "Readme.md"
requires-python = ">=3.8"
license = { text = "MIT" }

dependencies = [
    "colorama",
    "pynput"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "coverage"
]

[project.urls]
Homepage = "https://github.com/petervenables/adventure"

[tool.setuptools]
packages = ["adventure"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


